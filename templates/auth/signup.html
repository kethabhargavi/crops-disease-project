<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup | BIOSCAN</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="auth-page">

    <!-- BIOSCAN BRAND -->
    <div class="brand">

        <div class="brand-icon">
            🌿
        </div>

        <div>
            <h1>BIOSCAN</h1>
            <p>AI-Powered Crop Health Platform</p>
        </div>

    </div>


    <!-- SIGNUP CARD -->
    <div class="auth-box">

        <div class="auth-heading">

            <div class="heading-icon">
                👤
            </div>

            <div>
                <h2>Create Account</h2>

                <p>
                    Join BIOSCAN and start monitoring your crops.
                </p>
            </div>

        </div>


        <form method="post">

            <!-- EMAIL -->
            <div class="input-group">

                <span class="input-icon">
                    ✉
                </span>

                <input
                    type="email"
                    name="email"
                    placeholder="Email address"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="input-group">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword()"
                >
                    👁
                </button>

            </div>


            <!-- SIGNUP BUTTON -->
            <button
                type="submit"
                class="auth-button"
            >
                Sign Up
            </button>

        </form>


        <!-- LOGIN SWITCH -->
        <div class="auth-switch">

            <span></span>

            <p>Already have an account?</p>

            <span></span>

        </div>


        <a href="/" class="switch-link">
            Login
        </a>

    </div>

</div>


<script>

function togglePassword() {

    const password = document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>

</body>
</html>
